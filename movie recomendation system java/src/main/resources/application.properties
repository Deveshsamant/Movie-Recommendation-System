# Port and bind address come from config.json / $PORT / $HOST: see MovieRecommenderApplication.

# The console shows the banner and training steps, like the uvicorn "warning" level did.
spring.main.banner-mode=off
logging.level.root=WARN
# A browser asking for /favicon.ico is normal, and should not look like a problem in the window.
logging.level.org.springframework.web.servlet.PageNotFound=ERROR

# The front-end imports its modules from /static/..., as it did under FastAPI.
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

server.error.whitelabel.enabled=false
